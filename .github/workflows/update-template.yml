#
# ==========================================================================
# LOCAL PATCH -- DO NOT run this workflow casually
# ==========================================================================
# The scheduled trigger has been REMOVED on purpose. `update-template` does not
# version-check: it unconditionally deletes and regenerates all 8 workflow files
# from the upstream Upptime template. That would silently discard the local
# GitHub App token patch in every workflow, after which CI would break again
# (or, worse, quietly fall back to `github.token`, which cannot dispatch
# workflows).
#
# Before running this manually: be ready to re-apply the app-token patch
# (mint a token with actions/create-github-app-token and replace every
# `secrets.GH_PAT || github.token` / `secrets.GH_PAT` reference).
# Better still: get support upstream (upptime/upptime#1173).
# ==========================================================================


name: Update Template CI
on:
  repository_dispatch:
    types: [update_template]
  workflow_dispatch:
jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Get app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Update template
        uses: upptime/uptime-monitor@master
        with:
          command: "update-template"
        env:
          GH_PAT: ${{ steps.app-token.outputs.token }}
